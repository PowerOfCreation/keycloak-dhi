name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:      # Allow manual runs

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate clones the repository itself and reads renovate.json5 from that
      # clone, so no checkout is needed. Don't pass that file as
      # configurationFile either: it would then double as global config, which is
      # what forced global-only options like repositories into it.
      - uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          renovate-version: 44.39.1@sha256:00699dedb6d44bf645e3f0a98729bcdb660a660f1952a53d9592d3a127088b11
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          # Global-only option, so it lives here rather than in renovate.json5.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Same credentials as the build-push job (build-keycloak.yml),
          # so Renovate can resolve the DHI base from dhi.io.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"dhi.io","username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}]
