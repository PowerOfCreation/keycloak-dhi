name: build-keycloak-hardened

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/powerofcreation/keycloak

concurrency:
  group: build-keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pull der DHI-Basis von dhi.io (Docker-ID + PAT, kein Extra-Account)
      - name: Login to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push in deinen eigenen Namespace
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Keycloak-Version aus Dockerfile lesen
        id: ver
        run: |
          KC=$(grep -oP 'FROM dhi.io/keycloak:\K[^ ]+' Dockerfile)
          echo "kc=$KC" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.kc }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.kc }}-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true
