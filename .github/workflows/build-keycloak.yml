name: build-keycloak-hardened

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-keycloak.yml
  workflow_dispatch:

env:
  IMAGE: docker.io/powerofcreation/keycloak

concurrency:
  group: build-keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Pull the DHI base from dhi.io (Docker ID + PAT, no extra account)
      - name: Login to dhi.io
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push into your own namespace
      - name: Login to Docker Hub
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read Keycloak version from Dockerfile
        id: ver
        run: |
          # Runtime stage = FROM line without "AS <name>" (builder stage is the -dev variant)
          KC=$(awk '/^FROM dhi\.io\/keycloak:/ && !/ AS /{ match($0,/:[^@ ]+/); print substr($0,RSTART+1,RLENGTH-1) }' Dockerfile)
          echo "kc=$KC" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KC: ${{ steps.ver.outputs.kc }}
        run: |
          prefix="${KC}-r"
          last=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | awk -v p="$prefix" '
                index($0, p) == 1 {
                  s = substr($0, length(p) + 1)
                  if (s ~ /^[0-9]+$/ && s + 0 > m) m = s + 0
                }
                END { print m + 0 }')
          echo "tag=${prefix}$((last + 1))" >> "$GITHUB_OUTPUT"

      # Push without tags (by digest) - tags are only set on this exact
      # manifest below, after the smoke test passes. That way no consumer
      # ever sees an image that hasn't been booted.
      - name: Build & Push (by digest, no tags yet)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.kc }}
            org.opencontainers.image.base.name=dhi.io/keycloak:${{ steps.ver.outputs.kc }}
          provenance: mode=max
          sbom: true

      - name: Verify digest
        run: |
          if [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "::error::Build did not produce a digest"
            exit 1
          fi

      - name: Smoke test (boot the pushed digest against Postgres)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Exactly the artifact that's about to be tagged - no separate test build.
          docker pull "${IMAGE}@${DIGEST}"

          docker network create kc-smoke

          docker run -d --name pg --network kc-smoke \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_USER=keycloak -e POSTGRES_DB=keycloak \
            postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d

          # KC_DB/KC_HEALTH_ENABLED/KC_METRICS_ENABLED are build-time options already
          # baked into the builder stage (see Dockerfile) - don't set them here.
          # KC_HTTP_ENABLED/KC_HOSTNAME_STRICT are needed because "start --optimized"
          # otherwise expects TLS and fails without a certificate.
          docker run -d --name kc --network kc-smoke -p 9000:9000 \
            -e KC_DB_URL_HOST=pg -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD=smoke \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=smoke-only \
            "${IMAGE}@${DIGEST}"

          # Management port 9000, not 8080 (Keycloak 26 health endpoint).
          # curl runs on the runner: the DHI runtime is minimal and has no curl.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "ready after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Keycloak did not become ready within 600s"
          exit 1

      - name: Smoke test logs on failure
        if: failure()
        run: docker logs kc 2>&1 | tail -100 || true

      - name: Promote tags (no rebuild - same manifest as the smoke test)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.rel.outputs.tag }}
          KC: ${{ steps.ver.outputs.kc }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${KC}" \
            --tag "${IMAGE}:${KC}-${{ github.sha }}" \
            "${IMAGE}@${DIGEST}"

          # Don't assume digest preservation - verify it.
          for t in "${TAG}" "${KC}" "${KC}-${{ github.sha }}"; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{.Manifest.Digest}}')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${t} points to ${got}, expected ${DIGEST}"
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, GitHub OIDC)
        run: |
          # --recursive signs the index AND every arch manifest including attestations,
          # otherwise "cosign verify" fails on the amd64/arm64 child digest.
          cosign sign --yes --recursive "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Trivy scan (SARIF, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          KC: ${{ steps.ver.outputs.kc }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          BASE=$(grep '^FROM dhi\.io/' Dockerfile | grep -v ' AS ')

          cat > notes.md <<'EOF'
          ## Keycloak __KC__

          **Image:** `__IMAGE__`
          **Digest:** `__DIGEST__`

          ### Pull by digest (recommended, immutable)

          ```
          docker pull __IMAGE__:__TAG__@__DIGEST__
          ```

          ### Pull by tag

          ```
          docker pull __IMAGE__:__TAG__
          ```

          ### Pushed tags

          - `__IMAGE__:__TAG__`
          - `__IMAGE__:__KC__`
          - `__IMAGE__:__KC__-__SHA__`

          ### Platforms

          - linux/amd64
          - linux/arm64

          ### Base image

          `__BASE__`

          ### Smoke test

          This digest was started as a container (against Postgres) before tagging and
          successfully reported `/health/ready`.

          ### Verify signature

          Both the index and every arch manifest are signed - the command below works on
          `__DIGEST__` as well as on each individual platform digest (`docker buildx
          imagetools inspect __IMAGE__@__DIGEST__` shows the child digests).

          ```
          cosign verify __IMAGE__@__DIGEST__ \
            --certificate-identity-regexp '^https://github.com/PowerOfCreation/keycloak-dhi/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```
          EOF

          sed -i \
            -e "s|__KC__|${KC}|g" \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__DIGEST__|${DIGEST}|g" \
            -e "s|__TAG__|${TAG}|g" \
            -e "s|__SHA__|${SHA}|g" \
            -e "s|__BASE__|${BASE}|g" \
            notes.md

          gh release create "$TAG" \
            --title "Keycloak $KC ($TAG)" \
            --notes-file notes.md \
            --target "${SHA}"
