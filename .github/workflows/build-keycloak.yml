name: build-keycloak-hardened

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-keycloak.yml
  workflow_dispatch:

env:
  IMAGE: docker.io/powerofcreation/keycloak

concurrency:
  group: build-keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Pull der DHI-Basis von dhi.io (Docker-ID + PAT, kein Extra-Account)
      - name: Login to dhi.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push in deinen eigenen Namespace
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Keycloak-Version aus Dockerfile lesen
        id: ver
        run: |
          # Runtime-Stage = FROM-Zeile ohne "AS <name>" (Builder-Stage ist die -dev-Variante)
          KC=$(awk '/^FROM dhi\.io\/keycloak:/ && !/ AS /{ match($0,/:[^@ ]+/); print substr($0,RSTART+1,RLENGTH-1) }' Dockerfile)
          echo "kc=$KC" >> "$GITHUB_OUTPUT"

      - name: Release-Tag ermitteln
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KC: ${{ steps.ver.outputs.kc }}
        run: |
          prefix="${KC}-r"
          last=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | awk -v p="$prefix" '
                index($0, p) == 1 {
                  s = substr($0, length(p) + 1)
                  if (s ~ /^[0-9]+$/ && s + 0 > m) m = s + 0
                }
                END { print m + 0 }')
          echo "tag=${prefix}$((last + 1))" >> "$GITHUB_OUTPUT"

      # Push ohne Tags (by digest) - erst nach bestandenem Smoke-Test werden
      # unten Tags auf genau dieses Manifest gesetzt. So sieht kein
      # Konsument je ein Image, das nicht gebootet wurde.
      - name: Build & Push (by digest, noch ohne Tags)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.kc }}
            org.opencontainers.image.base.name=dhi.io/keycloak:${{ steps.ver.outputs.kc }}
          provenance: mode=max
          sbom: true

      - name: Digest pruefen
        run: |
          if [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "::error::Build hat keinen Digest geliefert"
            exit 1
          fi

      - name: Smoke-Test (bootet den gepushten Digest gegen Postgres)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Exakt das Artefakt, das gleich getaggt wird - kein separater Test-Build.
          docker pull "${IMAGE}@${DIGEST}"

          docker network create kc-smoke

          docker run -d --name pg --network kc-smoke \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_USER=keycloak -e POSTGRES_DB=keycloak \
            postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d

          # KC_DB/KC_HEALTH_ENABLED/KC_METRICS_ENABLED sind Build-Time-Optionen und
          # bereits in der Builder-Stage eingebacken (siehe Dockerfile) - hier nicht setzen.
          # KC_HTTP_ENABLED/KC_HOSTNAME_STRICT sind noetig, weil "start --optimized"
          # sonst TLS erwartet und ohne Zertifikat abbricht.
          docker run -d --name kc --network kc-smoke -p 9000:9000 \
            -e KC_DB_URL_HOST=pg -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD=smoke \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=smoke-only \
            "${IMAGE}@${DIGEST}"

          # Management-Port 9000, nicht 8080 (Keycloak 26 Health-Endpoint).
          # curl laeuft auf dem Runner: die DHI-Runtime ist minimal und hat kein curl.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "ready nach ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Keycloak wurde innerhalb von 600s nicht ready"
          exit 1

      - name: Smoke-Logs bei Fehler
        if: failure()
        run: docker logs kc 2>&1 | tail -100 || true

      - name: Tags promoten (kein Rebuild - selbes Manifest wie im Smoke-Test)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.rel.outputs.tag }}
          KC: ${{ steps.ver.outputs.kc }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${KC}" \
            --tag "${IMAGE}:${KC}-${{ github.sha }}" \
            "${IMAGE}@${DIGEST}"

          # Digest-Erhaltung nicht annehmen, sondern verifizieren.
          for t in "${TAG}" "${KC}" "${KC}-${{ github.sha }}"; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{.Manifest.Digest}}')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${t} zeigt auf ${got}, erwartet ${DIGEST}"
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Image signieren (keyless, GitHub OIDC)
        run: |
          # --recursive signiert Index UND jedes Arch-Manifest samt Attestations,
          # sonst schlaegt "cosign verify" auf dem amd64/arm64-Kind-Digest fehl.
          cosign sign --yes --recursive "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Trivy-Scan (SARIF, nicht blockierend)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: SARIF hochladen
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          KC: ${{ steps.ver.outputs.kc }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          BASE=$(grep '^FROM dhi\.io/' Dockerfile | grep -v ' AS ')

          cat > notes.md <<'EOF'
          ## Keycloak __KC__

          **Image:** `__IMAGE__`
          **Digest:** `__DIGEST__`

          ### Pull per Digest (empfohlen, unveränderlich)

          ```
          docker pull __IMAGE__@__DIGEST__
          ```

          ### Pull per Tag

          ```
          docker pull __IMAGE__:__TAG__
          ```

          ### Gepushte Tags

          - `__IMAGE__:__TAG__`
          - `__IMAGE__:__KC__`
          - `__IMAGE__:__KC__-__SHA__`

          ### Plattformen

          - linux/amd64
          - linux/arm64

          ### Basis-Image

          `__BASE__`

          ### Smoke-Test

          Dieser Digest wurde vor dem Taggen als Container gestartet (gegen Postgres) und hat
          `/health/ready` erfolgreich gemeldet.

          ### Signatur verifizieren

          Index und jedes Arch-Manifest sind signiert - der Befehl funktioniert auf `__DIGEST__`
          und auf jedem einzelnen Platform-Digest (`docker buildx imagetools inspect
          __IMAGE__@__DIGEST__` zeigt die Kind-Digests).

          ```
          cosign verify __IMAGE__@__DIGEST__ \
            --certificate-identity-regexp '^https://github.com/PowerOfCreation/keycloak-dhi/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```
          EOF

          sed -i \
            -e "s|__KC__|${KC}|g" \
            -e "s|__IMAGE__|${IMAGE}|g" \
            -e "s|__DIGEST__|${DIGEST}|g" \
            -e "s|__TAG__|${TAG}|g" \
            -e "s|__SHA__|${SHA}|g" \
            -e "s|__BASE__|${BASE}|g" \
            notes.md

          gh release create "$TAG" \
            --title "Keycloak $KC ($TAG)" \
            --notes-file notes.md \
            --target "${SHA}"
